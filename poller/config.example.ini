# Configuration du poller Apex → GitHub.
# Copiez ce fichier vers config.ini (ignoré par git) et adaptez-le :
#   cp config.example.ini config.ini

[apex]
# IP (ou nom d'hôte) locale de l'Apex sur votre réseau.
host = 192.168.1.50
# Identifiants seulement si votre Apex protège status.json (sinon laisser vide).
username =
password =
# Unité de la sonde de température côté Apex : F (défaut, converti en °C) ou C.
temp_unit = F

[poller]
# Intervalle entre deux relevés, en secondes (600 = 10 minutes).
interval_seconds = 600
timezone = Europe/Paris

[repo]
# Chemin du clone local de ce repo (rempli automatiquement par install.sh).
path = /home/CHANGEZ-MOI/Aquarium
branch = main
remote = origin

[probes]
# Nom exact de chaque sonde dans Apex Fusion (insensible à la casse).
# Laissez vide pour désactiver un paramètre (ex. pas de Trident → no3/po4 vides).
temp = Temp
ph = pH
orp = ORP
no3 = NO3
po4 = PO4
